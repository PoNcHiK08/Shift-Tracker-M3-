name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Offset keeps CI builds above the versionCodes of APKs built by hand (1, 2, …),
      # so every CI build installs as an update.
      - name: Set version code
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (calculator, .ics parser, UI smoke test)
        run: ./gradlew testDebugUnitTest --stacktrace

      # Release signing. Without the SIGNING_KEYSTORE_BASE64 secret, the release APK is signed with the public
      # dev key, as always, so each build installs over the previous one. With it (your own key, base64, plus
      # the SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD secrets) it is signed with your
      # key, which can't install over a dev-key build: see docs/cloud-sync.md, "Your own release key".
      # The debug APK always uses the dev key.
      - name: Choose the release key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "ALLOW_DEV_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
            echo "Release APK: signed with the public dev key (no SIGNING_KEYSTORE_BASE64 secret)."
            exit 0
          fi
          for name in SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::SIGNING_KEYSTORE_BASE64 is set but the $name secret isn't."; exit 1; }
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore" 2> /dev/null \
            || { echo "::error::The SIGNING_KEYSTORE_BASE64 secret isn't base64."; exit 1; }
          details=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" 2> /dev/null) \
            || { echo "::error::Can't open your key: check the SIGNING_STORE_PASSWORD and SIGNING_KEY_ALIAS secrets."; exit 1; }
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "Release APK: signed with your key from the SIGNING_* secrets. Its fingerprints (for Firebase):"
          printf '%s\n' "$details" | grep -E '^[[:space:]]*SHA(1|256):'

      # Cloud sync: app/google-services.json (never committed) comes from the GOOGLE_SERVICES_JSON secret,
      # the file's content as it is or base64-encoded. Written after the tests, so they never depend on it.
      # Without the secret (e.g. a pull request from a fork) the APKs build without cloud sync.
      - name: Add Firebase config from the secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::The GOOGLE_SERVICES_JSON secret is not set: these APKs have no cloud sync."
            exit 0
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON" | jq -e . > /dev/null 2>&1; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif ! printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json 2> /dev/null \
              || ! jq -e . app/google-services.json > /dev/null 2>&1; then
            echo "::error::GOOGLE_SERVICES_JSON is neither the JSON of google-services.json nor that JSON base64-encoded."
            exit 1
          fi
          # Both apps (release and .debug) must be in it, and Google sign-in (a Web client) must have been
          # enabled before it was downloaded.
          for package in com.vkurylo.shifttracker com.vkurylo.shifttracker.debug; do
            jq -e --arg p "$package" 'any(.client[]; .client_info.android_client_info.package_name == $p)' \
              app/google-services.json > /dev/null \
              || { echo "::error::google-services.json has no Android app $package. Add it in Firebase and download the file again."; exit 1; }
          done
          jq -e 'any(.client[].oauth_client[]?; .client_type == 3)' app/google-services.json > /dev/null \
            || { echo "::error::google-services.json has no Web client: enable Google sign-in in Firebase Authentication, then download the file again."; exit 1; }
          # Google sign-in also needs the SHA-1 of the key that signs each APK (the dev key, or your own key for
          # the release APK) registered for its app; the file lists the fingerprints registered when it was downloaded.
          dev=$(keytool -list -v -keystore app/signing/dev.keystore -storepass shifttracker -alias shifttracker \
            | sed -n 's/^[[:space:]]*SHA1: //p')
          release=$dev
          if [ -n "${SIGNING_KEYSTORE_PATH:-}" ]; then
            release=$(keytool -list -v -keystore "$SIGNING_KEYSTORE_PATH" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA1: //p')
          fi
          for package in com.vkurylo.shifttracker com.vkurylo.shifttracker.debug; do
            fingerprint=$([ "$package" = com.vkurylo.shifttracker ] && echo "$release" || echo "$dev")
            sha1=$(printf '%s' "$fingerprint" | tr -d ':' | tr 'A-F' 'a-f')
            jq -e --arg p "$package" --arg h "$sha1" \
              'any(.client[].oauth_client[]?; .client_type == 1 and .android_info.package_name == $p and ((.android_info.certificate_hash // "") | ascii_downcase) == $h)' \
              app/google-services.json > /dev/null \
              || echo "::warning::google-services.json has no SHA-1 fingerprint $fingerprint for $package. Unless it was added after the file was downloaded, Google refuses sign-in in that app (status 16 or 10): Firebase -> Project settings -> Your apps -> $package -> Add fingerprint, then download the file again and update the secret."
          done
          echo "Firebase config added: these APKs have cloud sync."

      # The release key was chosen above: the dev key (ALLOW_DEV_RELEASE_SIGNING, set there only without your
      # key: the release build refuses the dev key unless it is allowed) or yours (SIGNING_KEYSTORE_PATH + these).
      - name: Build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ShiftTracker.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ShiftTracker-debug.apk

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftTracker-${{ env.VERSION_CODE }}
          path: dist/*.apk
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # A permanent download link that always points at the newest build of the default branch:
      # https://github.com/<owner>/<repo>/releases/download/latest-build/ShiftTracker.apk
      # Other branches and pull requests only upload the workflow artifact above, so a feature branch
      # (e.g. one with a database migration) never replaces the APK behind this link.
      - name: Publish "latest-build" release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build dist/ShiftTracker.apk dist/ShiftTracker-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build ${VERSION_CODE} (${GITHUB_REF_NAME})" \
            --notes "Automatic build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. Install ShiftTracker.apk; ShiftTracker-debug.apk is a separate debug copy." \
            --prerelease
