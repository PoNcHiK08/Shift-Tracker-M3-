name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Offset keeps CI builds above the versionCodes of APKs built by hand (1, 2, …),
      # so every CI build installs as an update.
      - name: Set version code
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (calculator, .ics parser, UI smoke test)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ShiftTracker.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ShiftTracker-debug.apk

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftTracker-${{ env.VERSION_CODE }}
          path: dist/*.apk
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # A permanent download link that always points at the newest build:
      # https://github.com/<owner>/<repo>/releases/download/latest-build/ShiftTracker.apk
      - name: Publish "latest-build" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build dist/ShiftTracker.apk dist/ShiftTracker-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build ${VERSION_CODE} (${GITHUB_REF_NAME})" \
            --notes "Automatic build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. Install ShiftTracker.apk; ShiftTracker-debug.apk is a separate debug copy." \
            --prerelease
