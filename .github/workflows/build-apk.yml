name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Offset keeps CI builds above the versionCodes of APKs built by hand (1, 2, …),
      # so every CI build installs as an update.
      - name: Set version code
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (calculator, .ics parser, UI smoke test)
        run: ./gradlew testDebugUnitTest --stacktrace

      # Cloud sync: app/google-services.json (never committed) comes from the GOOGLE_SERVICES_JSON secret,
      # the file's content as it is or base64-encoded. Written after the tests, so they never depend on it.
      # Without the secret (e.g. a pull request from a fork) the APKs build without cloud sync.
      - name: Add Firebase config from the secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::The GOOGLE_SERVICES_JSON secret is not set: these APKs have no cloud sync."
            exit 0
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON" | jq -e . > /dev/null 2>&1; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif ! printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json 2> /dev/null \
              || ! jq -e . app/google-services.json > /dev/null 2>&1; then
            echo "::error::GOOGLE_SERVICES_JSON is neither the JSON of google-services.json nor that JSON base64-encoded."
            exit 1
          fi
          # Both apps (release and .debug) must be in it, and Google sign-in (a Web client) must have been
          # enabled before it was downloaded.
          for package in com.vkurylo.shifttracker com.vkurylo.shifttracker.debug; do
            jq -e --arg p "$package" 'any(.client[]; .client_info.android_client_info.package_name == $p)' \
              app/google-services.json > /dev/null \
              || { echo "::error::google-services.json has no Android app $package. Add it in Firebase and download the file again."; exit 1; }
          done
          jq -e 'any(.client[].oauth_client[]?; .client_type == 3)' app/google-services.json > /dev/null \
            || { echo "::error::google-services.json has no Web client: enable Google sign-in in Firebase Authentication, then download the file again."; exit 1; }
          echo "Firebase config added: these APKs have cloud sync."

      # The GitHub builds are signed with the public dev key on purpose, so each one installs
      # over the previous one. The release build refuses that key unless it is allowed here.
      - name: Build APKs
        env:
          ALLOW_DEV_RELEASE_SIGNING: "true"
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ShiftTracker.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ShiftTracker-debug.apk

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftTracker-${{ env.VERSION_CODE }}
          path: dist/*.apk
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # A permanent download link that always points at the newest build of the default branch:
      # https://github.com/<owner>/<repo>/releases/download/latest-build/ShiftTracker.apk
      # Other branches and pull requests only upload the workflow artifact above, so a feature branch
      # (e.g. one with a database migration) never replaces the APK behind this link.
      - name: Publish "latest-build" release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build dist/ShiftTracker.apk dist/ShiftTracker-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build ${VERSION_CODE} (${GITHUB_REF_NAME})" \
            --notes "Automatic build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. Install ShiftTracker.apk; ShiftTracker-debug.apk is a separate debug copy." \
            --prerelease
