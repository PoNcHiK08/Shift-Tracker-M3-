name: Cloud sync (Firebase emulators)

# Runs when the security rules or the sync code change: the rules tests (firebase/rules-test) and the app's
# Firestore store and sync engine against the rules (FirestoreEmulatorTest), on the Firebase emulators.
# Needs no secret and no Firebase project.
on:
  push:
    paths:
      - 'firebase/**'
      - 'app/src/main/java/com/vkurylo/shifttracker/data/**'
      - 'app/src/test/java/com/vkurylo/shifttracker/data/sync/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/cloud-sync-emulator.yml'
  pull_request:
    paths:
      - 'firebase/**'
      - 'app/src/main/java/com/vkurylo/shifttracker/data/**'
      - 'app/src/test/java/com/vkurylo/shifttracker/data/sync/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/cloud-sync-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-sync-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase/rules-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/rules-test/package-lock.json
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Rules tests
        run: npm test

  store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric's Android runtime jars, kept by the Build APK workflow (see there). Only restored here:
      # these tests need fewer Android versions, and saving that partial set under the same key would stop the
      # full one from ever being saved.
      - name: Robolectric cache key
        id: robolectric
        run: |
          version=$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          sdks=$(grep -rhoE 'sdk = \[[0-9, ]+\]' app/src/test | grep -oE '[0-9]+' | sort -un | paste -sd- -)
          echo "key=robolectric-$version-sdk$sdks" >> "$GITHUB_OUTPUT"
          echo "prefix=robolectric-$version-" >> "$GITHUB_OUTPUT"
      - name: Restore Robolectric's Android runtime jars
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: ${{ steps.robolectric.outputs.key }}
          restore-keys: ${{ steps.robolectric.outputs.prefix }}
      - name: Firestore store and sync engine on the emulators
        run: firebase/run-emulator-tests.sh --stacktrace
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: app/build/reports/tests/
